[package]
name = "sigmaos-database"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Database and storage engines"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-database"
readme = "README.md"
keywords = ["database", "sql", "storage"]
categories = ["database"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }
sigmaos-storage = { version = "0.1", path = "../SigmaOS-storage" }

[profile.release]
opt-level = 3
